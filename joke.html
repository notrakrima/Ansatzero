* {

body {

    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

/* =========================================
   GAME CONTAINER
========================================= */

.game {
    width: min(850px, 94vw);
    padding: 30px;
    border-radius: 35px;

    background: rgba(255,255,255,0.10);

    border: 1px solid rgba(255,255,255,0.18);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.15);

    backdrop-filter: blur(15px);

    position: relative;
    z-index: 2;
}

/* =========================================
   HEADER
========================================= */

.header {
    text-align: center;
}

.logo {
    font-size: 64px;

    animation:
        floating 3s ease-in-out infinite;
}

@keyframes floating {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-9px);
    }

}

h1 {
    margin: 0;

    font-size:
        clamp(42px, 8vw, 72px);

    background:
        linear-gradient(
            90deg,
            #ffe66d,
            #ff9df2
        );

    -webkit-background-clip: text;

    color: transparent;
}

.subtitle {
    margin-top: 8px;

    font-size: 19px;

    opacity: 0.8;
}

/* =========================================
   STATS
========================================= */

.stats {

    display: flex;

    justify-content: center;

    gap: 15px;

    flex-wrap: wrap;

    margin: 25px 0;
}

.stat {

    min-width: 140px;

    padding: 12px 20px;

    border-radius: 16px;

    background:
        rgba(0,0,0,0.25);

    border:
        1px solid rgba(255,255,255,0.1);
}

.stat-number {

    font-size: 28px;

    font-weight: bold;

    color: #ffe66d;
}

.stat-label {

    font-size: 13px;

    opacity: 0.7;

    text-transform: uppercase;

    letter-spacing: 1px;
}

/* =========================================
   JOKE CARD
========================================= */

.joke-card {

    position: relative;

    margin-top: 25px;

    padding: 45px 30px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.16),
            rgba(255,255,255,0.06)
        );

    border:
        1px solid rgba(255,255,255,0.15);

    text-align: center;

    min-height: 330px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    overflow: hidden;
}

.category {

    display: inline-block;

    margin: 0 auto 20px;

    padding: 8px 16px;

    border-radius: 30px;

    background:
        rgba(255,230,109,0.15);

    color: #ffe66d;

    font-weight: bold;

    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}

#joke {

    font-size:
        clamp(25px, 4vw, 39px);

    line-height: 1.3;

    font-weight: bold;

    max-width: 700px;

    margin: auto;
}

.question {

    margin-top: 20px;

    font-size: 17px;

    opacity: 0.65;
}

/* =========================================
   PUNCHLINE
========================================= */

#punchline {

    margin-top: 25px;

    font-size:
        clamp(25px, 4vw, 39px);

    line-height: 1.3;

    font-weight: bold;

    color: #ffe66d;

    opacity: 0;

    transform:
        scale(0.5)
        translateY(30px);

    max-height: 0;

    overflow: hidden;

    transition:
        opacity 0.45s ease,
        transform 0.45s cubic-bezier(.2,1.6,.4,1),
        max-height 0.45s ease;
}

#punchline.show {

    opacity: 1;

    transform:
        scale(1)
        translateY(0);

    max-height: 220px;
}

.punchline-label {

    display: block;

    font-size: 13px;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 8px;

    color: white;

    opacity: 0.65;
}

/* =========================================
   REVEAL BUTTON
========================================= */

.buttons {

    display: flex;

    justify-content: center;

    margin-top: 25px;
}

button {

    border: none;

    border-radius: 18px;

    padding: 19px 38px;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;

    color: white;

    background:
        linear-gradient(
            135deg,
            #ff4fd8,
            #8d4dff
        );

    box-shadow:
        0 8px 0 #6326b8,
        0 15px 30px rgba(0,0,0,0.25);

    transition:
        transform .12s,
        box-shadow .12s;
}

button:hover {

    transform:
        translateY(-4px)
        scale(1.03);
}

button:active {

    transform:
        translateY(3px);

    box-shadow:
        0 3px 0 #6326b8;
}

button:disabled {

    opacity: .4;

    cursor: not-allowed;

    transform: none;
}

/* =========================================
   MESSAGE
========================================= */

.message {

    text-align: center;

    min-height: 28px;

    margin-top: 20px;

    font-size: 17px;

    color: #ffe66d;

    font-weight: bold;
}

/* =========================================
   PROGRESS
========================================= */

.progress-area {

    margin-top: 25px;
}

.progress-text {

    display: flex;

    justify-content: space-between;

    font-size: 13px;

    opacity: .7;

    margin-bottom: 7px;
}

.progress {

    height: 9px;

    background:
        rgba(255,255,255,0.12);

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {

    height: 100%;

    width: 0%;

    background:
        linear-gradient(
            90deg,
            #ffe66d,
            #ff4fd8
        );

    border-radius: 20px;

    transition:
        width .4s ease;
}

/* =========================================
   JOKE ARRIVAL
========================================= */

.joke-card.new-joke {

    animation:
        jokeArrival .55s ease;
}

@keyframes jokeArrival {

    0% {

        opacity: 0;

        transform:
            scale(.92)
            translateY(20px);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}

/* =========================================
   FIREWORK PARTICLES
========================================= */

.firework {

    position: fixed;

    width: 7px;

    height: 7px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 20;

    box-shadow:
        0 0 8px currentColor,
        0 0 18px currentColor;

    animation:
        explode 1s ease-out forwards;
}

@keyframes explode {

    0% {

        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }

    100% {

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(.1);

        opacity: 0;
    }
}

/* =========================================
   FIREWORK FLASH
========================================= */

.flash {

    position: fixed;

    inset: 0;

    background:
        rgba(255,255,255,.25);

    pointer-events: none;

    z-index: 15;

    animation:
        flashEffect .25s ease-out forwards;
}

@keyframes flashEffect {

    0% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

/* =========================================
   FLYING EMOJIS
========================================= */

.flying-emoji {

    position: fixed;

    font-size: 42px;

    pointer-events: none;

    z-index: 25;

    animation:
        emojiFly 1.8s cubic-bezier(.2,.8,.3,1)
        forwards;
}

@keyframes emojiFly {

    0% {

        transform:
            translate(0,0)
            rotate(0deg)
            scale(.4);

        opacity: 0;
    }

    15% {

        opacity: 1;
    }

    100% {

        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(
                var(--rotation)
            )
            scale(1.2);

        opacity: 0;
    }
}

/* =========================================
   BIG CENTER EMOJI
========================================= */

.big-emoji {

    position: fixed;

    left: 50%;

    top: 50%;

    transform:

    pointer-events: none;

    z-index: 30;

    animation:

@keyframes bigEmoji {

    }

    }

/* =========================================================

========================================================= */

function shuffle(array) {

    const result = [...array];

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];
    }

    return result;
}

function nextJoke() {

    /*
       If we've used every joke,
       shuffle the entire bank again.
    */

    if (remainingJokes.length === 0) {

        remainingJokes =
            shuffle(jokes);

        jokesUsed = 0;

        messageElement.textContent =
            "🎉 You completed the joke round! New jokes incoming!";
    }


    currentJoke =
        remainingJokes.pop();

    jokesUsed++;

    revealLocked = false;

    /*
       Reset punchline
    */

    punchlineElement.classList.remove("show");

    punchlineElement.textContent = "";

    /*
       Update text
    */

    categoryElement.textContent =
        currentJoke.category;

    jokeElement.textContent =
        currentJoke.setup;

    questionElement.textContent =
        "🤔 🤔 🤔 🤔 🤔 🤔";

    /*
       Enable reveal
    */

    revealButton.disabled = false;

    /*
       Animate card
    */

    jokeCard.classList.remove(
        "new-joke"
    );

    void jokeCard.offsetWidth;

    jokeCard.classList.add(
        "new-joke"
    );

    updateStats();

}


/* =========================================================
   REVEAL
========================================================= */

function revealPunchline() {

    if (
        !currentJoke ||
        revealLocked
    ) {
        return;
    }

    revealLocked = true;

    revealButton.disabled = true;

    /*
       Show punchline
    */

    punchlineElement.innerHTML =
        `
        <span class="punchline-label">
            🎤 THE PUNCHLINE
        </span>
        ${currentJoke.punchline}
        `;

    punchlineElement.classList.add(
        "show"
    );

    questionElement.textContent =
        "😂 DID YOU GUESS IT?";

    /*
       Increase streak
    */

    streak++;

    updateStats();

    /*
       Message
    */

    if (streak >= 10) {

        messageElement.textContent =
            "🔥🔥🔥 LEGENDARY STREAK! 🔥🔥🔥";

    } else if (streak >= 5) {

        messageElement.textContent =
            "🔥 You're absolutely on fire!";

    } else {

        messageElement.textContent =
            "😂 HA! Got another one!";
    }


    /*
       Start a RANDOM celebration
    */

    celebrationNumber++;

    playRandomCelebration();


    /*
       Automatically move to next joke
    */

    setTimeout(
        () => {

            nextJoke();

        },
        6000
    );

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats() {

    jokesUsedElement.textContent =
        jokesUsed;

    streakElement.textContent =
        streak;

    jokesLeftElement.textContent =
        remainingJokes.length;


    const percentage =
        Math.round(
            (
                jokesUsed /
                jokes.length
            ) * 100
        );


    progressBar.style.width =
        percentage + "%";

    progressText.textContent =
        percentage + "%";
}


/* =========================================================
   RANDOM CELEBRATION
========================================================= */

function playRandomCelebration() {

    const celebrationTypes = [

        celebrationClassic,

        celebrationEmojiBurst,

        celebrationMega,

        celebrationSideFireworks,

        celebrationDoubleFirework,

        celebrationRainbow

    ];


    /*
       Prevent the exact same celebration
       twice in a row.
    */

    let choice;

    do {

        choice =
            Math.floor(
                Math.random() *
                celebrationTypes.length
            );

    } while (
        choice ===
        playRandomCelebration.lastChoice
    );


    playRandomCelebration.lastChoice =
        choice;


    celebrationTypes[choice]();

}


/* =========================================================
   FIREWORK
========================================================= */

function createFirework(
    x,
    y,
    color,
    particleCount = 28
) {

    for (
        let i = 0;
        i < particleCount;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "firework";

        particle.style.left =
            x + "px";

        particle.style.top =
            y + "px";

        particle.style.color =
            color;

        particle.style.background =
            color;


        const angle =
            Math.random() *
            Math.PI * 2;

        const distance =
            70 +
            Math.random() * 180;


        particle.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );

        particle.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(
            () => particle.remove(),
            1100
        );
    }

}


/* =========================================================
   FLASH
========================================================= */

function screenFlash() {

    const flash =
        document.createElement(
            "div"
        );

    flash.className =
        "flash";

    document.body.appendChild(
        flash
    );

    setTimeout(
        () => flash.remove(),
        300
    );

}


/* =========================================================
   EMOJI BURST
========================================================= */

function emojiBurst(
    emojis,
    amount = 18
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const emoji =
            document.createElement(
                "div"
            );

        emoji.className =
            "flying-emoji";

        emoji.textContent =
            emojis[
                Math.floor(
                    Math.random() *
                    emojis.length
                )
            ];


const corners = [
    { left: 8, top: 10 },
    { left: 92, top: 10 },
    { left: 8, top: 85 },
    { left: 92, top: 85 }
];

const corner =
    corners[Math.floor(Math.random() * corners.length)];

emoji.style.left =
    (corner.left + (Math.random() * 8 - 4)) + "vw";

emoji.style.top =
    (corner.top + (Math.random() * 8 - 4)) + "vh";


        emoji.style.setProperty(
            "--x",
            (
                (Math.random() - .5) *
                700
            ) +
            "px"
        );


        emoji.style.setProperty(
            "--y",
            (
                -100 -
                Math.random() * 500
            ) +
            "px"
        );


        emoji.style.setProperty(
            "--rotation",
            (
                Math.random() * 720 -
                360
            ) +
            "deg"
        );


        document.body.appendChild(
            emoji
        );


        setTimeout(
            () => emoji.remove(),
            1900
        );
    }

}


/* =========================================================
   BIG CENTER EMOJI
========================================================= */

function bigEmoji(emoji) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "big-emoji";

    element.textContent =
        emoji;

    document.body.appendChild(
        element
    );

    setTimeout(
        () => element.remove(),
        1000
    );

}


/* =========================================================
   RELEVANT EMOJIS
========================================================= */

        return [

            "🐸",
            "🐵",
            "🐮",

            "🦆"
        ];
    }


    if (category === "Food") {

        return [

            "🍔",
            "🍌",
            "🍎",
            "🍪",
            "🍓",
            "🌮"
        ];
    }


    if (category === "Technology") {

        return [
            "😂",
            "💻",
            "📱",
            "⌨️",
            "🖥️",
            "🤖",
            "⚡"

    if (category === "School") {

        return [
            "😂",
            "📚",
            "✏️",
            "🎓",
            "📝",
            "🏫",
            "🤓"
        ];
    }


    if (category === "Sports") {

        return [
            "😂",
            "🏀",
            "⚽",
            "🏆",
            "🏈",
            "🎾",
            "🥇"
        ];
    }


    if (category === "Space") {

        return [
            "😂",
            "🚀",
            "🌎",
            "🌙",
            "⭐",

    return [

        "✨",
        "💥",
        "👏"
    ];

}


/* =========================================================
   CELEBRATION 1
   CLASSIC FIREWORK
========================================================= */

function celebrationClassic() {

    screenFlash();

    bigEmoji("😂");

    const colors = [
        "#ffe66d",
        "#ff4fd8",
        "#65f6ff",
        "#8d6cff"
    ];


    setTimeout(
        () => {

            createFirework(
                window.innerWidth / 2,
                window.innerHeight / 2,
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ],
                38
            );

        },
        150
    );


    emojiBurst(
        getRelevantEmojis(),
        20
    );

}


/* =========================================================
   CELEBRATION 2
   EMOJI EXPLOSION
========================================================= */

function celebrationEmojiBurst() {

    bigEmoji(
        getRelevantEmojis()[1]
    );

    emojiBurst(
        getRelevantEmojis(),
        32
    );

    setTimeout(
        () => {

            createFirework(
                Math.random() *
                window.innerWidth,

                180 +
                Math.random() * 250,

                "#ffe66d",

                25
            );

        },
        400
    );

}


/* =========================================================
   CELEBRATION 3
   MEGA
========================================================= */

function celebrationMega() {

    screenFlash();

    bigEmoji("🎉");

    const colors = [
        "#ff4fd8",
        "#ffe66d",
        "#65f6ff",
        "#8d6cff",
        "#ffffff"
    ];


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        setTimeout(
            () => {

                createFirework(

                    100 +
                    Math.random() *
                    (
                        window.innerWidth -
                        200
                    ),

                    100 +
                    Math.random() *
                    400,

                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ],

                    30
                );

            },
            i * 180
        );
    }


    emojiBurst(
        getRelevantEmojis(),
        35
    );

}


/* =========================================================
   CELEBRATION 4
   SIDE FIREWORKS
========================================================= */

function celebrationSideFireworks() {

    bigEmoji("🤣");

    createFirework(
        100,
        window.innerHeight * .45,
        "#65f6ff",
        35
    );

    createFirework(
        window.innerWidth - 100,
        window.innerHeight * .45,
        "#ff4fd8",
        35
    );

    emojiBurst(
        getRelevantEmojis(),
        24
    );

}


/* =========================================================
   CELEBRATION 5
   DOUBLE FIREWORK
========================================================= */

function celebrationDoubleFirework() {

    screenFlash();

    bigEmoji("💥");

    setTimeout(
        () => {

            createFirework(
                window.innerWidth * .32,
                window.innerHeight * .42,
                "#ffe66d",
                45
            );

        },
        100
    );


    setTimeout(
        () => {

            createFirework(
                window.innerWidth * .68,
                window.innerHeight * .42,
                "#ff4fd8",
                45
            );

        },
        350
    );


    emojiBurst(
        getRelevantEmojis(),
        25
    );

}


/* =========================================================
   CELEBRATION 6
   RAINBOW FIREWORKS
========================================================= */

function celebrationRainbow() {

    const colors = [
        "#ff4f81",
        "#ff9d4f",
        "#ffe66d",
        "#65ff8d",
        "#65f6ff",
        "#8d6cff",
        "#ff4fd8"
    ];


    bigEmoji("🌈");


    for (
        let i = 0;
        i < colors.length;
        i++
    ) {

        setTimeout(
            () => {

                createFirework(

                    80 +
                    Math.random() *
                    (
                        window.innerWidth -
                        160
                    ),

                    100 +
                    Math.random() *
                    400,

                    colors[i],

                    25
                );

            },
            i * 120
        );
    }


    emojiBurst(
        getRelevantEmojis(),
        28
    );

}


/* =========================================================
   BUTTON
========================================================= */

revealButton.addEventListener(
    "click",
    revealPunchline
);


/* =========================================================
   ENTER KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !revealLocked
        ) {

            revealPunchline();

        }

    }
);


/* =========================================================
   START GAME
========================================================= */

remainingJokes =
    shuffle(jokes);

nextJoke();

</script>
